scenario:
  id: e2e-local-multi-tasks
  name: E2E Local Mode - Multi-Task Execution
  version: 1.0.0
  steps:
  - id: prep-mock
    task: mock-server
    phase: PREPARATION
    parameters:
      port: 0
    timeout: 30s
  - id: inject-gatling
    task: gatling
    phase: INJECTION
    dependsOn:
    - prep-mock
    parameters:
      simulation: test.SimpleSimulation
    timeout: 30s
  - id: assert-http
    task: direct-assertion
    phase: ASSERTION
    dependsOn:
    - inject-gatling
    description:
      title: Mock received the load
      sli: number of calls recorded by the mock server
      slo: at least 1 call received
    parameters:
      metric: http.requests.matched
      operator: GTE
      threshold: 1
    timeout: 30s
    ref: prep-mock
  - id: assert-gatling
    task: performance-thresholds
    phase: ASSERTION
    dependsOn:
    - inject-gatling
    description:
      title: Injection latency
      sli: p99 response time of the injected calls
      slo: p99 <= 1000 ms
    parameters:
      latency:
        p99: 1000
        unit: ms
        severity: CRITICAL
    timeout: 30s
    ref: inject-gatling
