scenario:
  id: e2e-local
  name: E2E Local Flow
  version: 1.0.0
  steps:
  - id: prep-create-dir
    task: filesystem
    phase: PREPARATION
    parameters:
      operation: CREATE
      path: /tmp/e2e-test-output
    timeout: 10s
  - id: inject-echo-data
    task: shell
    phase: INJECTION
    dependsOn:
    - prep-create-dir
    requiredContexts:
    - prep-create-dir
    parameters:
      command: echo
      args:
      - E2E local flow test data
      workingDirectory: /tmp/e2e-test-output
      timeout: 10
    timeout: 15s
  - id: assert-output-dir-exists
    task: direct-assertion
    phase: ASSERTION
    dependsOn:
    - inject-echo-data
    requiredContexts:
    - inject-echo-data
    description:
      title: Output directory produced
      sli: presence of the injection working directory
      slo: the directory exists at the end of the run
    parameters:
      metric: filesystem.exists
      path: /tmp/e2e-test-output
      expect: true
    timeout: 10s
