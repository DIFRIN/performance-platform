scenario:
  id: distributed-scenario
  name: Distributed Multi-Agent Scenario
  version: 1.0.0
  tags:
  - distributed
  - multi-agent
  taskAvailabilityTimeoutSeconds: 60
  steps:
  - id: agent1-prep
    task: shell
    phase: PREPARATION
    parameters:
      command: echo "Agent 1 ready"
    timeout: 10s
  - id: agent2-prep
    task: shell
    phase: PREPARATION
    parameters:
      command: echo "Agent 2 ready"
    timeout: 10s
  - id: distributed-load
    task: gatling
    phase: INJECTION
    requiredContexts:
    - agent1-prep
    - agent2-prep
    dependsOn:
    - agent1-prep
    - agent2-prep
    parameters:
      simulation: com.example.DistributedSimulation
      loadModel:
        type: CONSTANT
        parameters: { usersPerSec: 200, durationSeconds: 600 }
    timeout: 15m
  - id: distributed-assertion
    task: performance-thresholds
    phase: ASSERTION
    requiredContexts:
    - distributed-load
    dependsOn:
    - distributed-load
    description:
      title: Distributed throughput
      sli: aggregated throughput of the distributed injection
      slo: throughput >= 1000 req/s
    parameters:
      throughput:
        min: 1000
        unit: req_per_sec
        severity: CRITICAL
    timeout: 10s
    ref: distributed-load
