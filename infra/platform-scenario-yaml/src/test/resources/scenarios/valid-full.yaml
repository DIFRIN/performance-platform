scenario:
  id: full-scenario
  name: Full Feature Scenario
  version: 2.3.1
  tags:
  - performance
  - regression
  - nightly
  metadata:
    owner: team-a
    jira: PERF-456
    environment: staging
  taskAvailabilityTimeoutSeconds: 120
  steps:
  - id: purge-customer-db
    task: database
    phase: PREPARATION
    parameters:
      operation: PURGE
      datasource: customer-db
      tables:
      - customers
      - orders
    timeout: 60s
  - id: seed-test-data
    task: database
    phase: PREPARATION
    requiredContexts:
    - purge-customer-db
    dependsOn:
    - purge-customer-db
    parameters:
      operation: EXECUTE
      datasource: customer-db
      script: classpath:fixtures/seed-customers.sql
    timeout: 120s
  - id: start-mock-server
    task: mockserver
    during: scenario
    parameters:
      expectations:
      - method: GET
        path: /api/customers
        responseStatus: 200
        responseBody: '{"customers":[]}'
    timeout: 30s
  - id: customer-api-load
    task: gatling
    phase: INJECTION
    dependsOn:
    - seed-test-data
    parameters:
      simulation: com.example.CustomerApiSimulation
      loadModel:
        type: RAMP
        parameters: { from: 10, to: 100, durationSeconds: 120 }
      protocol: HTTP
    timeout: 10m
    retryPolicy:
      maxAttempts: 2
      initialDelay: 5s
      multiplier: 2.0
      maxDelay: 30s
  - id: check-p95-latency
    task: performance-thresholds
    phase: ASSERTION
    requiredContexts:
    - customer-api-load
    dependsOn:
    - customer-api-load
    description:
      title: Customer API latency
      sli: p95 and error rate of the customer API calls
      slo: p95 <= 500 ms and error rate <= 1 %
    parameters:
      latency:
        p95: 500
        unit: ms
        severity: WARNING
      errorRate:
        max: 1.0
        unit: percent
        severity: CRITICAL
    timeout: 10s
    ref: customer-api-load
  - id: verify-db-row-count
    task: direct-assertion
    phase: ASSERTION
    requiredContexts:
    - customer-api-load
    dependsOn:
    - customer-api-load
    description:
      title: Requests persisted
      sli: number of rows in requests_log
      slo: at least one request persisted
    parameters:
      metric: database.scalar
      datasource: customer-db
      query: SELECT COUNT(*) FROM requests_log
      operator: GT
      threshold: 0
      severity: CRITICAL
    timeout: 10s
