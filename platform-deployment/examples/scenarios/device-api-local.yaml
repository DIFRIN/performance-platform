# =============================================================================
# Scénario : Device API — Mode LOCAL (plateforme)
# SUT-B : POST HTTP → DB lookup → Kafka produce
#
# Prérequis :
#   docker compose -f platform-deployment/examples/docker-compose-sut.yaml up -d
#   java -jar platform-app.jar --spring.profiles.active=local,examples-local
#
# Configuration technique dans application-examples-local.yaml :
#   platform.datasources.sut-db    → jdbc:postgresql://localhost:5433/sut_devices
#   platform.kafka-clusters.iot-sut → localhost:9093 / topic: device-events
#   platform.http-targets.device-api → http://localhost:8084
# =============================================================================
scenario:
  id: device-api-local
  name: "Test SUT-B Device API — mode LOCAL"
  version: "1.0"
  tags: [device-api, local]
  metadata:
    owner: perf-team
    sut: device-api
  execution: { mode: LOCAL }

  report:
    components: { device-api: "1.0.0-SNAPSHOT" }
    environment: LOCAL-DOCKER
    objective: "Validate the Device API release with a 60-second ramp"
    testType: LOAD
    loadDescription: "Ramp from 1 to 1000 users per second over 60 seconds"
    assumptions:
      - "10000 active devices seeded before injection"
      - "Dedicated Kafka topic; one HTTP request per virtual user"
    criteria:
      - { name: Maximum duration, metric: durationSeconds, taskId: load-test, operator: "<=", threshold: 75 }
      - { name: Target volume, metric: totalRequests, taskId: load-test, operator: ">=", threshold: 30000 }
      - { name: No technical errors, metric: errorRate, taskId: load-test, operator: "==", threshold: 0 }
      - { name: p95 objective, metric: p95Ms, taskId: load-test, operator: "<=", threshold: 500 }
      - { name: p99 objective, metric: p99Ms, taskId: load-test, operator: "<=", threshold: 1000 }
    # No saturation evidence configured: report remains WARNING even if checks pass.
    # Add sourced observations + saturation criteria, or bounded graph exports, when available.

  steps:
    - id: reset-devices
      task: database
      phase: PREPARATION
      parameters:
        datasource: sut-db
        operation: PURGE
        table: devices
      timeout: 30s

    # PURGE avant POPULATE car ON CONFLICT DO NOTHING
    - id: seed-devices
      task: database
      phase: PREPARATION
      dependsOn: [reset-devices]
      requiredContexts: [reset-devices]
      parameters:
        datasource: sut-db
        operation: POPULATE
        scriptPath: "classpath:sql/seed-sut-devices.sql"
      timeout: 2m

    - id: warmup
      task: http-client
      phase: PREPARATION
      dependsOn: [seed-devices]
      requiredContexts: [seed-devices]
      parameters:
        target: device-api
        method: POST
        path: submit-event
        # Le SUT exige device_id dans la query string, pas dans un body JSON.
        queryParams:
          device_id: device-0001
        expectedStatus: 200
      timeout: 10s

    - id: check-health
      task: http-client
      phase: PREPARATION
      dependsOn: [warmup]
      requiredContexts: [warmup]
      parameters:
        target: device-api
        method: GET
        path: health
        expectedStatus: 200
      timeout: 30s

    - id: load-test
      task: gatling
      phase: INJECTION
      dependsOn: [check-health]
      requiredContexts: [check-health]
      parameters:
        target: device-api
        path: submit-event
        method: POST
        # Pas de `simulation` : l'injection HTTP est construite depuis ces parametres.
        # Placeholders resolus a chaque requete ({index} global, {uuid}, {random:a-b}, {choice:..}, ...)
        queryParams:
          device_id: "device-{index:4}"
        headers:
          X-Request-Id: "{uuid}"
        expectedStatus: 200
        loadModel:
          type: RAMP
          parameters: { from: 1, to: 1000, durationSeconds: 60 }
      timeout: 5m

    - id: count-device-events
      task: kafka-consumer
      phase: ASSERTION
      dependsOn: [load-test]
      requiredContexts: [load-test]
      parameters:
        cluster: iot-sut
        topic: device-events
        operation: COUNT
      timeout: 1m

    - id: assert-kafka-produced
      task: kafka
      phase: ASSERTION
      dependsOn: [count-device-events]
      requiredContexts: [count-device-events]
      parameters:
        metric: consumedCount
        refTaskId: count-device-events
        operator: GTE
        value: 30000
      timeout: 2m

    - id: assert-db-intact
      task: database-assertion
      phase: ASSERTION
      dependsOn: [load-test]
      requiredContexts: [load-test]
      parameters:
        datasource: sut-db
        query: "SELECT COUNT(*) FROM devices WHERE is_active = true"
        value: 10000
        operator: EQ
      timeout: 1m

loadModels:
  device-api-ramp:
    type: RAMP
    target: 1000
    duration: 60s
