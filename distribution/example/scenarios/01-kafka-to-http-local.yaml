# =============================================================================
# Scenario 1 - Kafka injection -> SUT -> DB lookup -> HTTP to device address
# =============================================================================
# LOCAL platform mode (all tasks in one JVM).
#
# Flow:
#   1. platform starts WireMock EMBEDDED on port 8090 (mock-server step)
#   2. platform seeds devices; each device_dns points at the embedded mock
#   3. platform produces commands into Kafka (iot-commands)
#   4. SUT stub consumes, reads device_dns from the DB, POSTs to that address
#   5. platform asserts the mock received calls (http-mock)
#
# Run:
#   docker compose -f distribution/example/docker-compose-local.yaml \
#     run --rm -e SCENARIO_FILE=01-kafka-to-http-local.yaml platform
#
# IDE: start infra + SUT, then run the platform with --spring.profiles.active=local
#      and --scenario=file:distribution/example/scenarios/01-kafka-to-http-local.yaml
# =============================================================================
scenario:
  id: 01-kafka-to-http-local
  name: "Kafka injection -> SUT -> DB -> HTTP device endpoint (LOCAL)"
  version: "1.0.0"
  tags: [example, kafka, http, local]
  metadata:
    executionGroup: example-sut
    owner: perf-team
    sut: sut
  execution: { mode: LOCAL }

  steps:
    - id: start-mock
      task: mock-server
      phase: PREPARATION
      parameters:
        deployment: EMBEDDED
        action: START
        port: 8090
        mappingsPath: classpath:mock
      timeout: 30s

    - id: reset-sut-db
      task: database
      phase: PREPARATION
      parameters:
        datasource: sut-db
        operation: PURGE
        table: devices
      timeout: 30s

    - id: seed-sut-db
      task: database
      phase: PREPARATION
      dependsOn: [reset-sut-db]
      requiredContexts: [reset-sut-db]
      parameters:
        datasource: sut-db
        operation: POPULATE
        scriptPath: "classpath:sql/seed-sut-devices.sql"
      timeout: 2m

    - id: check-sut
      task: http-client
      phase: PREPARATION
      dependsOn: [seed-sut-db, start-mock]
      requiredContexts: [seed-sut-db, start-mock]
      parameters:
        target: sut-api
        method: GET
        path: health
        expectedStatus: 200
      timeout: 30s

    - id: inject-commands
      task: kafka-producer
      phase: INJECTION
      dependsOn: [check-sut]
      requiredContexts: [check-sut]
      parameters:
        cluster: iot-sut
        topic: iot-commands
        operation: PRODUCE
        messageCount: 1000
        messageTemplate: '{"device_id":"device-{index:4}","command":"ping"}'
      timeout: 2m

    - id: wait-dispatch
      task: shell
      phase: ASSERTION
      dependsOn: [inject-commands]
      requiredContexts: [inject-commands]
      parameters:
        command: sleep
        args: ["8"]
      timeout: 20s

    # The assertion is on the embedded WireMock of the agent (here: the local
    # process). The SUT reached it at the address stored in devices.device_dns.
    - id: assert-mock-called
      task: http-mock
      phase: ASSERTION
      dependsOn: [wait-dispatch]
      requiredContexts: [wait-dispatch]
      parameters:
        target: wiremock
        metric: receivedCalls
        operator: GTE
        value: 1
      timeout: 1m

    - id: stop-mock
      task: mock-server
      phase: ASSERTION
      dependsOn: [assert-mock-called]
      requiredContexts: [assert-mock-called]
      parameters:
        deployment: EMBEDDED
        action: STOP
      timeout: 10s
