# =============================================================================
# Scenario 2 - HTTP injection -> SUT endpoint -> DB lookup -> Kafka produce
# =============================================================================
# DISTRIBUTED platform mode.
#
# Routing (broadcast + agent.supported-tasks, ADR-015):
#   database              -> agent-kafka
#   http-client           -> agent-http
#   gatling               -> agent-http
#   shell                 -> agent-kafka
#   kafka-consumer/kafka  -> agent-kafka
#
# Submit:
#   curl -X POST http://localhost:8080/api/v1/scenarios \
#     -H 'Content-Type: application/yaml' \
#     --data-binary @distribution/example/scenarios/02-http-to-kafka-distributed.yaml
# =============================================================================
scenario:
  id: 02-http-to-kafka-distributed
  name: "HTTP injection -> SUT -> DB -> Kafka (DISTRIBUTED)"
  version: "1.0.0"
  tags: [example, http, kafka, distributed]
  metadata:
    owner: perf-team
    sut: sut
  execution: { mode: DISTRIBUTED }

  steps:
    - id: reset-sut-db
      task: database
      phase: PREPARATION
      parameters:
        datasource: sut-db
        operation: PURGE
        table: devices
      timeout: 30s

    - id: seed-sut-db
      task: database
      phase: PREPARATION
      dependsOn: [reset-sut-db]
      requiredContexts: [reset-sut-db]
      parameters:
        datasource: sut-db
        operation: POPULATE
        scriptPath: "classpath:sql/seed-sut-devices.sql"
      timeout: 2m

    - id: check-sut
      task: http-client
      phase: PREPARATION
      dependsOn: [seed-sut-db]
      requiredContexts: [seed-sut-db]
      parameters:
        target: sut-api
        method: GET
        path: health
        expectedStatus: 200
      timeout: 30s

    - id: inject-events
      task: gatling
      phase: INJECTION
      dependsOn: [check-sut]
      requiredContexts: [check-sut]
      parameters:
        target: sut-api
        path: submit-event
        method: POST
        queryParams:
          device_id: "device-{index:4}"
        headers:
          X-Request-Id: "{uuid}"
        expectedStatus: 200
        loadModel:
          type: RAMP
          parameters: { from: 1, to: 1000, durationSeconds: 60 }
      timeout: 5m

    - id: wait-events
      task: shell
      phase: ASSERTION
      dependsOn: [inject-events]
      requiredContexts: [inject-events]
      parameters:
        command: sleep
        args: ["3"]
      timeout: 15s

    - id: count-events
      task: kafka-consumer
      phase: ASSERTION
      dependsOn: [wait-events]
      requiredContexts: [wait-events]
      parameters:
        cluster: iot-sut
        topic: device-events
        operation: COUNT
      timeout: 1m

    - id: assert-events-produced
      task: kafka
      phase: ASSERTION
      dependsOn: [count-events]
      requiredContexts: [count-events]
      parameters:
        metric: consumedCount
        refTaskId: count-events
        operator: GTE
        value: 10000
      timeout: 2m
