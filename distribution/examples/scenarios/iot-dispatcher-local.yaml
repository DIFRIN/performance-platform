# =============================================================================
# Scenario : IoT Dispatcher — Mode LOCAL
# =============================================================================
scenario:
  id: iot-dispatcher-local
  name: "Test de performance SUT-A"
  version: "1.0.0"
  tags: [iot, dispatcher, sut-a]
  metadata:
    owner: perf-team
    sut: iot-dispatcher
  execution: { mode: LOCAL }

  steps:
    - id: reset-wiremock
      task: http-client
      phase: PREPARATION
      parameters:
        target: wiremock
        method: DELETE
        path: reset-requests
        expectedStatus: 200
      timeout: 30s

    - id: preload-iot-commands
      task: kafka-producer
      phase: PREPARATION
      dependsOn: [reset-wiremock]
      requiredContexts: [reset-wiremock]
      parameters:
        cluster: iot-sut
        topic: iot-commands
        messageCount: 1000
        messageTemplate: '{"device_id":"device-{index}","command":"ping","ts":"{timestamp}"}'
      timeout: 2m

    - id: wait-for-dispatch
      task: http-client
      phase: PREPARATION
      dependsOn: [preload-iot-commands]
      requiredContexts: [preload-iot-commands]
      parameters:
        target: iot-dispatcher-health
        method: GET
        path: health
        expectedStatus: 200
      timeout: 35s

    - id: inject-load
      task: gatling
      phase: INJECTION
      dependsOn: [wait-for-dispatch]
      requiredContexts: [wait-for-dispatch]
      parameters:
        cluster: iot-sut
        topic: iot-commands
        protocol: kafka
        key: 'device-{index:5}'
        headers:
          x-correlation-id: '{uuid}'
          x-execution: '{executionId}'
        payload:
          device_id: 'device-{index:5}'
          command: load-test
          value: '{random:1-100}'
        loadModel:
          type: CONSTANT
          parameters: { usersPerSec: 200, durationSeconds: 30 }
      timeout: 2m

    - id: count-iot-commands
      task: kafka-consumer
      phase: ASSERTION
      dependsOn: [inject-load]
      requiredContexts: [inject-load]
      parameters:
        cluster: iot-sut
        topic: iot-commands
        operation: COUNT
      timeout: 1m

    - id: assert-iot-commands-count
      task: kafka
      phase: ASSERTION
      dependsOn: [count-iot-commands]
      requiredContexts: [count-iot-commands]
      parameters:
        metric: consumedCount
        refTaskId: count-iot-commands
        operator: GTE
        value: 7000
      timeout: 1m

    - id: assert-http-dispatched
      task: http-mock
      phase: ASSERTION
      dependsOn: [inject-load]
      requiredContexts: [inject-load]
      parameters:
        target: wiremock
        metric: receivedCalls
        value: 7000
        operator: GTE
      timeout: 1m
