# =============================================================================
# IDE local development dependencies
# =============================================================================
# Only the external infrastructure: PostgreSQL, Kafka (KRaft), WireMock.
# The platform itself runs from the IDE (or mvn spring-boot:run).
#
# Usage:
#   docker compose -f distribution/local-dev/docker-compose.yaml up -d
#   docker compose -f distribution/local-dev/docker-compose.yaml down -v
#
# Host ports (used by the IDE run configurations):
#   PostgreSQL : localhost:5432  (postgres/changeme, database "performance")
#   Kafka      : localhost:9092
#   WireMock   : localhost:8090
# =============================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: perf-ide-postgres
    environment:
      POSTGRES_DB: performance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - perf_ide_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d performance"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - perf-ide-net

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: perf-ide-kafka
    environment:
      CLUSTER_ID: "perf-platform-ide"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - perf-ide-net

  wiremock:
    image: wiremock/wiremock:3.12.1
    container_name: perf-ide-wiremock
    ports:
      - "8090:8080"
    volumes:
      # Reuse the demo mappings (GET/POST /api/users).
      - ../examples/demo-stack/wiremock:/home/wiremock
    command: --port 8080 --verbose
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/__admin/mappings > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - perf-ide-net

networks:
  perf-ide-net:
    driver: bridge

volumes:
  perf_ide_postgres:
